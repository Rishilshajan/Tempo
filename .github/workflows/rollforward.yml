name: Nightly rollforward

# Hits the deployed app's secret-guarded rollforward endpoint on a schedule.
# Host-agnostic (works whether Tempo runs on Vercel, Fly, a VPS, etc).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://tempo.yourdomain.com   (no trailing slash)
#   CRON_SECRET  must match the deployed CRON_SECRET env var
#
# Note: GitHub's scheduler runs in UTC and can be delayed (and is paused after
# ~60 days of repo inactivity). Fine for a nightly, idempotent job.

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: rollforward
  cancel-in-progress: false

jobs:
  rollforward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger rollforward
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          code=$(curl -sS --fail-with-body --max-time 60 --retry 3 --retry-delay 10 \
            -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/rollforward")
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" = "200"
